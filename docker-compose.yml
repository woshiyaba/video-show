services:
  video-show:
    build:
      context: .
      args:
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmmirror.com}
        DEBIAN_MIRROR: ${DOCKER_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DOCKER_DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    container_name: video-show
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/video_show.db
      FRONTEND_DIR: /app/frontend/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wikiroco.com,http://localhost:8002}
    ports:
      - "${APP_PORT:-8002}:8002"
    volumes:
      - ./data:/app/data
