services:
  video-show:
    build: .
    container_name: video-show
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/video_show.db
      FRONTEND_DIR: /app/frontend/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
