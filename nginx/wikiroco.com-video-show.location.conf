# Include this snippet INSIDE the existing:
# server { ... server_name wikiroco.com; ... }
#
# Do not add another `listen 80` or `listen 443`; the existing virtual host
# continues to own those ports.

location = /video-show {
    return 308 /video-show/;
}

location ^~ /video-show/ {
    # No trailing slash here: the backend must receive the /video-show prefix.
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /video-show;

    # Media files upload directly from the browser to COS. Only small JSON
    # requests pass through Nginx.
    client_max_body_size 2m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
